# Build the Hugo site and deploy it to GitHub Pages.
# Runs on every push to master — including the vault's own commits (tw-enc-sync, under vault/), which MUST redeploy so the live
# manifest matches the repository. Do not add paths-ignore.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false   # queue rapid vault saves instead of dropping them

env:
  HUGO_VERSION: "0.168.0"
  # sha256 of hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz (from the release's checksums.txt)
  HUGO_SHA256: "787f100057328824f38c6ad7c87ff10d6451ae0a7bc39cedaad0dd2bcde17e53"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo (pinned + checksum-verified)
        run: |
          set -euo pipefail
          f="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$f"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo" && tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/hugo" hugo
          "$RUNNER_TEMP/hugo/hugo" version

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build (content check, Hugo, vault passthrough + verification)
        env:
          HUGO: ${{ runner.temp }}/hugo/hugo
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: bash scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          include-hidden-files: "true"   # /.well-known/security.txt

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
