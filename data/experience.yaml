  from: 2019          # confirm start year
  to: null            # current
  role:
    en: Senior Security Analyst, Cloud Security Team
    de: Senior Security Analyst, Cloud-Security-Team
  summary:
    en: >-
      Security assessments and penetration tests of large enterprise environments, these days mostly cloud
