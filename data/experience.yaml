      Red-Team-Assessments von Cloud- und Container-Plattformen geleitet und gebe Offensive Kubernetes Security 101 mit.
  details:
    en:
      - "Senior Security Analyst since November 2026, before that security analyst and penetration tester."
      - "Pentests of networks, desktop and web applications, containers and multi-cloud setups."
      - "Led scenario-based red-team assessments of cloud and container platforms."
      - "Research on automating assessments in Azure and Kubernetes and on improving our pentest techniques."
      - "Heavy user of AI agents, mostly to build automations for my assessments."
      - "Trainer at TROOPERS and HM Training Solutions (Offensive Kubernetes Security 101)."
    de:
      - "Seit November 2026 Senior Security Analyst, davor Security Analyst und Penetrationstester."
      - "Pentests von Netzwerken, Desktop- und Webanwendungen, Containern und Multi-Cloud-Umgebungen."
      - "Leitung szenariobasierter Red-Team-Assessments von Cloud- und Container-Plattformen."
      - "Forschung zur Automatisierung von Assessments in Azure und Kubernetes und zur Verbesserung unserer Pentest-Techniken."
      - "Nutze KI-Agenten intensiv, vor allem für Automatisierungen in meinen Assessments."
      - "Trainer bei TROOPERS und HM Training Solutions (Offensive Kubernetes Security 101)."
  note:
    en: "Joined after a half-year career break, backpacking through South East Asia."
    de: "Eingestiegen nach einer halbjährigen Auszeit als Backpacker in Südostasien."

