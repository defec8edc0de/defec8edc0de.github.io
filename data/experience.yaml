      container platforms, for several DAX 10 companies among others. I've led scenario-based red-team
      assessments of cloud and container platforms and co-teach Offensive Kubernetes Security 101.
    de: >-
      Sicherheitsanalysen und Penetrationstests großer Unternehmensumgebungen, inzwischen meistens Cloud und
      Kubernetes. Ich gehöre zum Cloud-Security-Team von ERNW und habe sehr viele Cloud-Accounts und
